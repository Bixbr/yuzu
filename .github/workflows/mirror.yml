name: Sync upstream android branch

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-mirror-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out mirror repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MIRROR_TOKEN }}

      - name: Fetch and push upstream android branch
        env:
          UPSTREAM_URL: https://git.bixed.xyz/Bix/yuzu.git
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if ! git remote get-url upstream >/dev/null 2>&1; then
            git remote add upstream "$UPSTREAM_URL"
          fi

          git fetch --no-tags upstream refs/heads/android:refs/remotes/upstream/android
          git push --force origin refs/remotes/upstream/android:refs/heads/android
